<!doctype html>
<!-- EXAMPLE SCENE — series end card. Kicker pops, the next episode's question slides up, then the follow line.
     Everything lands by 1.0 s so the closing lines stay ≥ 2 s on screen. Leave this shot's caption empty. -->
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <link rel="stylesheet" href="assets/kit/kit.css" />
      <style>
        #root { position: absolute; inset: 0; overflow: hidden; background: radial-gradient(ellipse at 50% 40%, var(--sky-1), var(--sky-0) 70%); }
        #next-card { top: 560px; }
        #next-ep { font-family: var(--font-ui); font-weight: 700; font-size: 34px; color: var(--mute); margin-bottom: 26px; }
        .next-mask { display: block; overflow: hidden; }
        #next-dot { position: absolute; left: 50%; top: 1180px; margin-left: -60px; width: 120px; height: 120px; border-radius: 50%; border: 8px dashed var(--red); }
      </style>
      <div data-hf-id="hf-7p3o" id="root" data-composition-id="scene-example-next" data-width="1080" data-height="1920">
        <div data-hf-id="hf-ibaq" id="next-card" class="next-card">
          <div data-hf-id="hf-84y1" id="next-ep">เมื่อไฟดับทั้งเมือง · EP 2</div>
          <div data-hf-id="hf-p8fu" id="next-kicker" class="next-kicker">ตอนต่อไป</div>
          <div data-hf-id="hf-9gee" class="next-title">
            <span data-hf-id="hf-bj6v" class="next-mask"><span data-hf-id="hf-o3u6" id="next-l1" data-layout-allow-overflow>ใครอยู่</span></span>
            <span data-hf-id="hf-unif" class="next-mask"><span data-hf-id="hf-4bd0" id="next-l2" data-layout-allow-overflow>หน้าประตู</span></span>
          </div>
          <div data-hf-id="hf-mzes" class="next-mask"><div data-hf-id="hf-7m2j" id="next-cta" class="next-cta" data-layout-allow-overflow>กดติดตามไว้ ไม่พลาดตอนต่อไป</div></div>
        </div>
        <div data-hf-id="hf-8k10" id="next-dot"></div>
      </div>
      <script>
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#next-ep", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "power2.out" }, 0.05);
        tl.fromTo("#next-kicker", { scale: 0 }, { scale: 1, duration: 0.3, ease: "back.out(2.2)" }, 0.15);
        tl.fromTo("#next-l1", { yPercent: 105 }, { yPercent: 0, duration: 0.3, ease: "power3.out" }, 0.4);
        tl.fromTo("#next-l2", { yPercent: 105 }, { yPercent: 0, duration: 0.3, ease: "power3.out" }, 0.5);
        tl.fromTo("#next-cta", { yPercent: 110 }, { yPercent: 0, duration: 0.3, ease: "power3.out" }, 0.6);
        tl.fromTo("#next-dot", { scale: 0.2, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: "back.out(2)" }, 0.9);
        tl.fromTo("#next-dot", { rotation: 0 }, { rotation: 90, duration: 2.2, ease: "none" }, 1.0);
        window.__timelines["scene-example-next"] = tl;
      </script>
    </template>
  </body>
</html>

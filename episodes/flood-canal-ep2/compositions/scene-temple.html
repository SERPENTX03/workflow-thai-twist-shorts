<!doctype html>
<!-- The temple hall on the hill, night, lamplit. 12 s clip, four shots.
     0: wide, crowd of silhouettes, counter 0→127. 3.2: push to the pillar board "บันทึกระดับน้ำ ต.ค. 2554".
     6.4: red ring on the line "14 ต.ค. 54 · 02:00 น้ำปิดประตูหน้า". 9.6: pull back, chip "ตรงกับที่ป้าแดงบอก". -->
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <link rel="stylesheet" href="assets/kit/kit.css" />
      <style>
        #root { position: absolute; inset: 0; overflow: hidden; background: #1c140d; }
        #tp-world { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 540px 640px; }
        #tp-wall { position: absolute; left: -100px; right: -100px; top: 0; height: 1120px; background: repeating-linear-gradient(90deg, #6b4a2f 0 70px, #5b3e27 70px 74px); }
        #tp-beam { position: absolute; left: -100px; right: -100px; top: 0; height: 150px; background: linear-gradient(180deg, #1d1209, #33220f); }
        #tp-floor { position: absolute; left: -100px; right: -100px; top: 1120px; height: 900px; background: linear-gradient(180deg, #4a3220, #2a1c11); }
        .tp-pillar { position: absolute; top: 140px; width: 90px; height: 990px; background: linear-gradient(90deg, #8a2f2f, #b34040 50%, #8a2f2f); }
        #tp-lamp { position: absolute; left: -100px; top: 100px; width: 1300px; height: 1100px; background: radial-gradient(circle at 50% 35%, rgba(255, 200, 130, 0.38), rgba(255, 200, 130, 0) 62%); mix-blend-mode: screen; }
        #tp-board { position: absolute; left: 380px; top: 330px; width: 320px; height: 440px; background: var(--paper); border: 10px solid #3a2a1c; color: var(--ink); text-align: center; font-family: var(--font-ui); }
        #tp-b1 { font: 700 34px var(--font-display); margin-top: 18px; }
        #tp-b2 { font: 500 28px var(--font-ui); margin-top: 6px; }
        #tp-wave { position: absolute; left: 20px; right: 20px; top: 130px; height: 150px; background: linear-gradient(180deg, rgba(60, 120, 190, 0.85), rgba(40, 90, 150, 0.95)); border-top: 6px solid #1d3f66; }
        #tp-line { position: absolute; left: 6px; right: 6px; top: 120px; height: 8px; background: var(--red); }
        #tp-b3 { position: absolute; left: 0; right: 0; top: 300px; font: 700 32px var(--font-display); line-height: 1.3; }
        #tp-ring { position: absolute; left: 392px; top: 600px; width: 300px; height: 130px; border-radius: 30px; border: 8px dashed var(--red); }
        #tp-crowd { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
        .tp-p { position: absolute; width: 80px; height: 208px; }
        #tp-count { left: 640px; top: 150px; width: 330px; }
        #tp-tag { left: 70px; top: 260px; }
        #tp-chip { left: 160px; top: 1010px; }
        #tp-key { left: 320px; top: 200px; }
      </style>
      <div data-hf-id="hf-7rt9" id="root" data-composition-id="scene-temple" data-width="1080" data-height="1920">
        <div data-hf-id="hf-d13n" id="tp-world" data-layout-allow-overflow>
          <div data-hf-id="hf-knlx" id="tp-wall" data-layout-allow-overflow></div>
          <div data-hf-id="hf-ilbg" id="tp-beam" data-layout-allow-overflow></div>
          <div data-hf-id="hf-njod" id="tp-floor" data-layout-allow-overflow></div>
          <div data-hf-id="hf-1cui" class="tp-pillar" style="left:40px"></div><div data-hf-id="hf-zb18" class="tp-pillar" style="left:950px"></div>
          <div data-hf-id="hf-2sk6" id="tp-board">
            <div data-hf-id="hf-iobo" id="tp-b1">บันทึกระดับน้ำ</div><div data-hf-id="hf-0dgd" id="tp-b2">ต.ค. 2554</div>
            <div data-hf-id="hf-9y55" id="tp-wave"></div><div data-hf-id="hf-4hcw" id="tp-line"></div>
            <div data-hf-id="hf-ouiu" id="tp-b3">14 ต.ค. · 02:00<br data-hf-id="hf-x5px"/></div>
          </div>
          <div data-hf-id="hf-uv04" id="tp-lamp"></div>
          <div data-hf-id="hf-a4cg" id="tp-crowd" data-layout-allow-overflow></div>
          <div data-hf-id="hf-09ao" id="tp-ring"></div>
        </div>
        <div data-hf-id="hf-a0vu" id="tp-count" class="stat"><div data-hf-id="hf-14e4" class="stat-label">คนหลบน้ำในศาลา</div><div data-hf-id="hf-yeow"><span data-hf-id="hf-fo8v" id="tp-num" class="stat-num">0</span><span data-hf-id="hf-xkgh" class="stat-unit">คน</span></div></div>
        <div data-hf-id="hf-hfce" id="tp-tag" class="tag you"><i data-hf-id="hf-wt6k"></i>ศาลาวัดบนเนิน</div>
        <div data-hf-id="hf-suk6" id="tp-key" class="chip red">น้ำปิดประตูหน้า</div>
        <div data-hf-id="hf-m6o0" id="tp-chip" class="chip">ตรงกับป้าแดง ทุกตัวเลข</div>
      </div>
      <script>
        // static crowd of silhouettes (deterministic positions)
        const crowd = document.querySelector("#tp-crowd"), ids = ["man", "woman", "elder", "man-wide"];
        for (let k = 0; k < 14; k++) {
          const row = k % 2, x = 70 + (k * 71) % 960 + row * 30, y = 905 + row * 70;
          crowd.insertAdjacentHTML("beforeend", `<svg class="who tp-p sil" style="left:${x}px;top:${y}px;transform:scale(${row ? 1.1 : 0.95})" viewBox="0 0 200 520"><use href="#${ids[k % 4]}"/></svg>`);
        }
        const tl = gsap.timeline({ paused: true });
        // shot 0 — wide, counter
        tl.fromTo("#tp-world", { scale: 1.04 }, { scale: 1, duration: 3.2, ease: "power2.out" }, 0);
        tl.fromTo("#tp-crowd", { y: 60, opacity: 0 }, { y: 0, opacity: 1, duration: 0.7, ease: "power2.out" }, 0.1);
        const c = { v: 0 }, num = document.querySelector("#tp-num");
        tl.fromTo(c, { v: 0 }, { v: 127, duration: 1.6, ease: "power2.out", onUpdate: () => { num.textContent = Math.round(c.v); } }, 0.3);
        tl.fromTo("#tp-count", { x: 600 }, { x: 0, duration: 0.35, ease: "power3.out" }, 0.2);
        tl.fromTo("#tp-tag", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "back.out(2)" }, 0.5);
        // shot 1 — push to the board; counter and tag leave
        tl.fromTo("#tp-count", { x: 0 }, { x: 600, duration: 0.3, ease: "power3.in", immediateRender: false }, 3.0);
        tl.fromTo("#tp-tag", { opacity: 1 }, { opacity: 0, duration: 0.2, immediateRender: false }, 3.0);
        tl.fromTo("#tp-world", { scale: 1, x: 0, y: 0 }, { scale: 1.6, x: 0, y: 140, duration: 1.4, ease: "power2.inOut", immediateRender: false }, 3.2);
        tl.fromTo("#tp-crowd", { opacity: 1 }, { opacity: 0.4, duration: 0.8, immediateRender: false }, 3.2);
        // shot 2 — the 02:00 line
        tl.fromTo("#tp-ring", { scale: 0.3, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: "back.out(2)" }, 6.6);
        tl.fromTo("#tp-key", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "back.out(2)" }, 7.0);
        // shot 3 — pull back, match
        tl.fromTo("#tp-world", { scale: 1.6, y: 140 }, { scale: 1.05, y: 0, duration: 1.4, ease: "power2.inOut", immediateRender: false }, 9.6);
        tl.fromTo("#tp-key", { opacity: 1 }, { opacity: 0, duration: 0.2, immediateRender: false }, 9.6);
        tl.fromTo("#tp-chip", { x: -700 }, { x: 0, duration: 0.35, ease: "power3.out" }, 9.7);
        window.__timelines["scene-temple"] = tl;
      </script>
    </template>
  </body>
</html>

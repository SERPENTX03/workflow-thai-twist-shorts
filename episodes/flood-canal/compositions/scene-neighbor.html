<!doctype html>
<!-- ป้าแดง's house seen from her doorway, standing in the flood outside. The frame (lintel + jambs + a "บ้านป้าแดง" sign) and the
     foreground water stay fixed; the camera moves only inside the doorway. เจ้าโอ่ง stays OUTSIDE in front of the frame, growling.
     Used twice (7.2 s and 4.8 s clips), so it reads from local 0 either way.
     Clues on screen: TV ticker "ต.ค. 54", calendar ตุลาคม 2554, red keypad phone, no shadow or reflection under her, the dog growling.
     0: wide + tag. 2.4: push toward her phone. 4.8: drift to the TV. -->
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <link rel="stylesheet" href="assets/kit/kit.css" />
      <style>
        #root { position: absolute; inset: 0; overflow: hidden; background: #2b1d12; }
        #nb-world { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 620px 760px; }
        #nb-wall { position: absolute; left: -200px; right: -200px; top: 0; height: 1240px;
          background: repeating-linear-gradient(90deg, #7a5536 0 64px, #6a482c 64px 68px); }
        #nb-floor { position: absolute; left: -200px; right: -200px; top: 1240px; height: 900px; background: linear-gradient(180deg, #5a3e27, #2e1f14); }
        #nb-lamp { position: absolute; left: -200px; top: 200px; width: 1400px; height: 1300px;
          background: radial-gradient(circle at 60% 40%, rgba(255, 200, 130, 0.35), rgba(255, 200, 130, 0) 60%); mix-blend-mode: screen; }
        /* calendar stuck on ต.ค. 2554 */
        #nb-cal { position: absolute; left: 650px; top: 330px; width: 230px; height: 250px; background: var(--paper); border-top: 40px solid var(--red); box-shadow: 0 8px 20px rgba(0,0,0,0.4); text-align: center; color: var(--ink); }
        #nb-cal-m { font: 700 30px var(--font-ui); margin-top: 10px; }
        #nb-cal-y { font: 700 62px var(--font-display); line-height: 1.1; }
        #nb-cal-grid { margin: 8px 30px 0; height: 56px; background: repeating-linear-gradient(90deg, rgba(24,32,46,0.25) 0 18px, transparent 18px 28px); }
        /* old CRT-ish TV */
        #nb-tvset { position: absolute; left: 60px; top: 560px; width: 470px; height: 380px; border-radius: 28px; background: #3a3a40; border: 12px solid #222228; }
        #nb-screen { position: absolute; left: 22px; top: 22px; width: 400px; height: 300px; border-radius: 18px; background: #3b6fa8; overflow: hidden; }
        #nb-news { position: absolute; left: 20px; top: 24px; font: 700 40px var(--font-display); color: #fff; line-height: 1.2; }
        #nb-logo { position: absolute; right: 16px; top: 16px; width: 64px; height: 64px; border-radius: 50%; background: #f6c445; color: #18202e; font: 700 30px/64px var(--font-ui); text-align: center; }
        #nb-ticker { position: absolute; left: 0; right: 0; bottom: 0; height: 64px; background: var(--red); overflow: hidden; }
        #nb-tick-text { position: absolute; left: 0; top: 0; white-space: nowrap; font: 700 34px/64px var(--font-ui); color: #fff; }
        #nb-glow { position: absolute; left: -200px; top: 380px; width: 900px; height: 800px; background: radial-gradient(circle, rgba(140, 190, 255, 0.28), rgba(140, 190, 255, 0) 60%); mix-blend-mode: screen; }
        #nb-cab { position: absolute; left: 40px; top: 940px; width: 520px; height: 300px; background: #4a3220; border: 8px solid #33220f; }
        #nb-aunt { left: 610px; top: 680px; width: 215px; height: 560px; --top: #b8443a; --skirt: #5a3f6e; --hair: #a4a4aa; }
        #nb-phone { position: absolute; left: 770px; top: 960px; width: 44px; height: 80px; border-radius: 8px; background: var(--red); border: 4px solid #5a1010; }
        #nb-phone-scr { position: absolute; left: 6px; top: 6px; width: 24px; height: 22px; background: #b6e3a0; }
        #nb-water { top: 1190px; height: 900px; }
        #nb-tag { left: 600px; top: 590px; }
        #nb-ring { position: absolute; left: 730px; top: 920px; width: 130px; height: 160px; border-radius: 50%; border: 7px dashed var(--gold); }
        /* fixed doorway frame — everything above is "inside", everything below it is "outside" */
        #nb-lintel { position: absolute; left: 0; right: 0; top: 0; height: 150px; background: linear-gradient(180deg, #1d1209, #33220f); }
        .nb-jamb { position: absolute; top: 0; width: 84px; height: 1500px; background: linear-gradient(90deg, #1d1209, #33220f); }
        #nb-sign { position: absolute; left: 330px; top: 20px; width: 420px; height: 100px; border-radius: 14px; background: #6a482c; border: 6px solid #2a1a0e;
          font: 700 56px/88px var(--font-display); color: #f2e6c8; text-align: center; }
        #nb-fw { top: 1200px; height: 800px; }
        #nb-dog { position: absolute; left: -40px; top: 940px; width: 520px; height: 358px; transform-origin: 260px 358px; }
        #nb-dog-rw { position: absolute; left: -40px; top: 1300px; width: 520px; height: 358px; }
        #nb-dog-refl { position: absolute; left: 0; top: 0; width: 520px; height: 358px; }
      </style>
      <div id="root" data-composition-id="scene-neighbor" data-width="1080" data-height="1920">
        <div id="nb-world" data-layout-allow-overflow>
          <div id="nb-wall" data-layout-allow-overflow></div>
          <div id="nb-floor" data-layout-allow-overflow></div>
          <div id="nb-cal"><div id="nb-cal-m">ตุลาคม</div><div id="nb-cal-y">2554</div><div id="nb-cal-grid"></div></div>
          <div id="nb-cab"></div>
          <div id="nb-tvset">
            <div id="nb-screen">
              <div id="nb-news">ข่าวด่วน</div>
              <div id="nb-logo">9</div>
              <div id="nb-ticker"><div id="nb-tick-text" data-layout-ignore>ต.ค. 54 · น้ำเหนือไหลบ่า · ประกาศภัย 65 จังหวัด · ต.ค. 54 · น้ำเหนือไหลบ่า · ประกาศภัย 65 จังหวัด ·</div></div>
            </div>
          </div>
          <div id="nb-glow"></div>
          <div id="nb-lamp"></div>
          <!-- she has no shadow and no reflection -->
          <svg id="nb-aunt" class="who" viewBox="0 0 200 520"><use href="#auntie" /></svg>
          <div id="nb-phone"><div id="nb-phone-scr"></div></div>
          <div id="nb-water" class="flood" data-layout-allow-overflow></div>
          <div id="nb-ring"></div>
          <div id="nb-tag" class="tag warn"><i></i>ป้าแดง · เพื่อนบ้านยาย</div>
        </div>
        <div id="nb-lintel"></div>
        <div class="nb-jamb" style="left:0"></div><div class="nb-jamb" style="right:0"></div>
        <div id="nb-sign">บ้านป้าแดง</div>
        <div id="nb-dog-rw" class="mirror-y"><svg id="nb-dog-refl" class="who" viewBox="0 0 320 220"><use href="#dog-growl" /></svg></div>
        <svg id="nb-dog" class="who" viewBox="0 0 320 220"><use href="#dog-growl" /></svg>
        <div id="nb-fw" class="flood" data-layout-allow-overflow></div>
      </div>
      <script>
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#nb-tick-text", { x: 0 }, { x: -900, duration: 7.2, ease: "none" }, 0);
        // shot 0 — wide through the doorway; the dog stops OUTSIDE at the door and bristles
        tl.fromTo("#nb-world", { scale: 1.04 }, { scale: 1, duration: 2.4, ease: "power2.out" }, 0);
        tl.fromTo("#nb-dog", { x: -600 }, { x: 0, duration: 0.7, ease: "power3.out" }, 0.1);
        tl.fromTo("#nb-dog-refl", { x: -600 }, { x: 0, duration: 0.7, ease: "power3.out" }, 0.1);
        tl.fromTo("#nb-tag", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "back.out(2)" }, 0.4);
        tl.fromTo("#nb-sign", { y: -200 }, { y: 0, duration: 0.35, ease: "back.out(1.6)" }, 0.1);
        // shot 1 — push toward the phone in her hand; the dog plants its paws and leans back
        tl.fromTo("#nb-world", { scale: 1, x: 0, y: 0 }, { scale: 1.22, x: -120, y: -60, duration: 2.2, ease: "power2.inOut", immediateRender: false }, 2.4);
        tl.fromTo("#nb-dog", { rotation: 0 }, { rotation: -5, x: -30, duration: 0.5, ease: "power2.out", immediateRender: false }, 2.6);
        tl.fromTo("#nb-ring", { scale: 0.2, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: "back.out(2)" }, 3.0);
        // shot 2 — drift across to the TV
        tl.fromTo("#nb-world", { scale: 1.22, x: -120, y: -60 }, { scale: 1.3, x: 230, y: -40, duration: 2.0, ease: "power2.inOut", immediateRender: false }, 4.8);
        tl.fromTo("#nb-ring", { opacity: 1 }, { opacity: 0, duration: 0.2, immediateRender: false }, 4.8);
        window.__timelines["scene-neighbor"] = tl;
      </script>
    </template>
  </body>
</html>

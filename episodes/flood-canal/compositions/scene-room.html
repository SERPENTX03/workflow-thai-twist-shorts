      <script>
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#room-world", { scale: 1 }, { scale: 1.1, duration: 4.8, ease: "power1.inOut" }, 0);
        tl.fromTo("#room-wrain", { backgroundPosition: "0px 0px, 0px 0px" }, { backgroundPosition: "-120px 900px, -90px 700px", duration: 4.8, ease: "none" }, 0);
        // shot 0 — the dog trots in, tag pops
        tl.fromTo("#room-dog", { x: -700 }, { x: 0, duration: 0.9, ease: "power2.out" }, 0.1);
        tl.fromTo("#room-dog-shadow", { x: -700 }, { x: 0, duration: 0.9, ease: "power2.out" }, 0.1);
        tl.fromTo("#room-tag-dog", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "back.out(2)" }, 0.9);
        // shot 1 — a dark line of water slides under the door, then the floor floods
        tl.fromTo("#room-seep", { scaleX: 0 }, { scaleX: 1, duration: 0.9, ease: "power2.out" }, 2.5);
        tl.fromTo("#room-water", { y: 0 }, { y: -164, duration: 1.6, ease: "power2.inOut" }, 3.0);

        tl.fromTo("#room-chip", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "back.out(2)" }, 3.5);
        window.__timelines["scene-room"] = tl;

<!doctype html>
<!-- Animatic stand-in for a scene that has not been drawn yet.
     scripts/build.mjs points any missing compositions/scene-<name>.html here. -->
<html
  data-composition-variables='[
    {"id":"label","type":"string","label":"Scene","default":"scene"},
    {"id":"note","type":"string","label":"Shots","default":""}
  ]'
>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <link rel="stylesheet" href="assets/kit/kit.css" />
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          background: linear-gradient(180deg, var(--sky-0), var(--sky-1));
          font-family: var(--font-ui);
        }
        #placeholder-grid {
          position: absolute;
          inset: -120px;
          background-image:
            linear-gradient(rgba(239, 232, 218, 0.06) 2px, transparent 2px),
            linear-gradient(90deg, rgba(239, 232, 218, 0.06) 2px, transparent 2px);
          background-size: 120px 120px;
        }
        #placeholder-tag {
          left: 70px;
          top: 260px;
        }
        #placeholder-label {
          position: absolute;
          left: 70px;
          right: 70px;
          top: 360px;
          font-family: var(--font-display);
          font-weight: 700;
          font-size: 120px;
          line-height: 1.1;
          color: var(--white);
        }
        #placeholder-note {
          position: absolute;
          left: 70px;
          right: 70px;
          top: 540px;
          font-size: 40px;
          line-height: 1.5;
          color: var(--mute);
        }
      </style>
      <div id="root" data-composition-id="placeholder" data-width="1080" data-height="1920">
        <div id="placeholder-grid" data-layout-allow-overflow></div>
        <div id="placeholder-tag" class="chip red">ยังไม่ได้วาดฉากนี้</div>
        <div id="placeholder-label" data-var-text="label">scene</div>
        <div id="placeholder-note" data-var-text="note"></div>
      </div>
      <script>
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#placeholder-grid", { x: 0, y: 0 }, { x: -120, y: -60, duration: 12, ease: "none" }, 0);
        tl.fromTo("#placeholder-label", { y: 40 }, { y: 0, duration: 0.5, ease: "power3.out" }, 0);
        window.__timelines["placeholder"] = tl;
      </script>
    </template>
  </body>
</html>

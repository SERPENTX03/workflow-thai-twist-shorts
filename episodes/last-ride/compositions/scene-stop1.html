<!doctype html>
<!-- First pickup at the old sala: the faded garland, the hazard lights, the mother and girl in the side mirror, gone,
     the truck sinking as someone boards, the door he never opened, Chan's text.
     Views: road/arrive|hazard|dip|slam · sala/garland · mirror/two|close|empty · cab/ask|look|key · phone/chan -->
<html data-composition-variables='[{"id":"shots","type":"string","label":"Shots (from build)","default":"[]"}]'>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <link rel="stylesheet" href="assets/kit/kit.css" />
      <link rel="stylesheet" href="assets/kit/stories/last-ride.css" />
      <style>#root { position: absolute; inset: 0; overflow: hidden; background: #05070c; }</style>
      <div data-hf-id="hf-6eln" id="root" data-composition-id="scene-stop1" data-width="1920" data-height="1080"></div>
      <script src="assets/kit/stories/last-ride.js"></script>
      <script>
        const tl = gsap.timeline({ paused: true });
        const S = LR.shots("scene-stop1", [{ at: 0, dur: 4, view: "road/arrive" }]);
        const L = LR.layer;
        let mirrorsSeen = 0;
        const views = {
          road: LR.V.road((c) => ({
            x: 300, k: 0.66, stop: 'sala', stopX: 1360, lights: true,
            arrive: c.act === 'arrive', hazard: c.act !== 'arrive', dip: c.act === 'dip' ? 0.5 : undefined, slam: c.act === 'slam' ? 0.1 : undefined,
            cam0: c.act === 'slam' ? { scale: 1.25, x: 420, y: 60 } : { scale: 1, x: 0 }, cam1: c.act === 'slam' ? { scale: 1.3, x: 450, y: 70 } : { scale: 1.05, x: -30 },
          })),
          // the sala post, close: a faded garland hangs from a nail
          sala: {
            html: (c) => L('<use href="#lr-l-road-sky" width="1920" height="1080"/><use href="#lr-road-sala" x="260" y="-140" width="1380" height="1200"/><use href="#lr-garland" x="400" y="330" width="210" height="630"/>')
              + '<div class="lr-night" style="background:rgba(6,10,26,.45)"></div><div style="position:absolute;inset:0;background:radial-gradient(circle at 26% 55%, rgba(255,181,71,.18), rgba(0,0,0,0) 40%)"></div>',
            anim: (c) => LR.cam(c, { scale: 1.05, x: 80 }, { scale: 1.14, x: 140 }),
          },
          mirror: {
            html: (c) => { const show = c.act === 'empty' ? 'empty' : 'two'; return LR.V.mirror({ show }).html(c); },
            anim: (c) => {
              const first = c.act === 'two' && mirrorsSeen++ === 0;
              if (first) c.tl.fromTo(`#${c.id}-ppl`, { opacity: 0 }, { opacity: 1, duration: 1.0, ease: 'sine.inOut' }, c.t(0.6));
              LR.cam(c, { scale: c.act === 'close' ? 1.25 : 1, x: c.act === 'close' ? -60 : 0, y: c.act === 'close' ? 40 : 0 }, { scale: c.act === 'close' ? 1.32 : 1.05, x: c.act === 'close' ? -80 : 0, y: c.act === 'close' ? 50 : 0 });
            },
          },
          // in the cab; for "key" the ignition, close: the key still in, he never got out
          cab: {
            html: (c) => c.act === 'key'
              ? L('<rect width="1920" height="1080" fill="#1b1d22"/><path d="M0 700 Q960 640 1920 700 V1080 H0Z" fill="#24272d"/><circle cx="960" cy="470" r="120" fill="#2b2f36"/><circle cx="960" cy="470" r="70" fill="#15171b"/><rect x="940" y="430" width="40" height="80" rx="8" fill="#3a3f47"/>')
                + `<svg class="lr-layer" viewBox="0 0 1920 1080"><g id="${c.id}-key"><rect x="944" y="452" width="32" height="36" rx="6" fill="#2b2f36"/><circle cx="960" cy="540" r="34" fill="none" stroke="#b7b9bc" stroke-width="12"/><g transform="rotate(-10 960 574)"><rect x="910" y="574" width="96" height="140" rx="14" fill="var(--lr-key-tag, #a9844c)" stroke="#7a5e34" stroke-width="8"/><circle cx="958" cy="604" r="11" fill="#3b2c1c"/><path d="M930 646 H986 M930 672 H974" stroke="#7a5e34" stroke-width="8"/></g></g></svg>` + '<div class="lr-night" style="background:rgba(6,10,26,.3)"></div>'
              : LR.V.cab({ face: c.act === 'look' ? 'wary' : null, dark: 0.3 }).html(c),
            anim: (c) => {
              if (c.act === 'key') { c.tl.fromTo(`#${c.id}-key`, { rotation: -6 }, { rotation: 6, svgOrigin: '960 470', duration: 0.8, yoyo: true, repeat: Math.ceil(c.dur / 0.8), ease: 'sine.inOut' }, c.at); LR.cam(c, { scale: 1 }, { scale: 1.08 }); }
              else LR.V.cab({ face: c.act === 'look' ? 'wary' : null, push: 1.08 }).anim(c);
            },
          },
          phone: LR.V.phone({ screen: 'chat-chan', time: '23:41', msg: 0.4, msgSel: '.lr-chan-msg', buzz: false }),
          _: { html: () => '' },
        };
        LR.run({ comp: 'scene-stop1', prefix: 's1', tl, shots: S, views });
        window.__timelines["scene-stop1"] = tl;
      </script>
    </template>
  </body>
</html>

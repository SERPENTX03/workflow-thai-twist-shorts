<!doctype html>
<!-- Home: warm light inside, the night outside. The wife on the stool with the phone, the son asleep against her arm,
     two plates (one untouched). Ek knocks without a sound, takes off his cap, stays until the room is dimmed.
     Views: drive/home · house/out|in · table/plates · door/knock · wife/phone|cry|hug · ek/door|door2|leave ·
     cut/glass|dim · son/ask -->
<html data-composition-variables='[{"id":"shots","type":"string","label":"Shots (from build)","default":"[]"}]'>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <link rel="stylesheet" href="assets/kit/kit.css" />
      <link rel="stylesheet" href="assets/kit/stories/last-ride.css" />
      <style>#root { position: absolute; inset: 0; overflow: hidden; background: #05070c; }</style>
      <div data-hf-id="hf-tna7" id="root" data-composition-id="scene-home" data-width="1920" data-height="1080"></div>
      <script src="assets/kit/stories/last-ride.js"></script>
      <script>
        const tl = gsap.timeline({ paused: true });
        const S = LR.shots("scene-home", [{ at: 0, dur: 4, view: "house/in" }]);
        const L = LR.layer;
        // the cut-away house with everyone in place; o: wife face, son awake, ek pose, dim
        function house(c, o = {}) {
          const wife = LR.who('wife', { id: `${c.id}-wife`, x: 360, feet: 930, h: 430, r: o.phone ? 'hold' : null, rProp: o.phone ? 'phone' : null, face: o.wifeFace || 'worried', cls: '' });
          const son = LR.who('son', { id: `${c.id}-son`, x: 470, feet: 930, h: 325, face: o.sonAwake ? null : 'tired', style: o.sonAwake ? '' : 'transform-origin:50% 100%;rotate:-9deg;' });
          const ek = LR.who('ek', { id: `${c.id}-ek`, x: 1350, feet: 935, h: 450, r: o.knock ? 'raise' : null, face: o.ekFace || 'sad', nocap: o.nocap, cls: 'lr-spirit lr-rim' });
          return `<div id="${c.id}-house" style="position:absolute;inset:0;--lr-house-light:1">` + L('<use href="#lr-l-house" width="1920" height="1080"/>') + wife + son + L('<use href="#lr-l-house-table" width="1920" height="1080"/>') + ek
            + '<div class="lr-warm"></div><div style="position:absolute;left:1180px;top:0;right:0;bottom:0;background:rgba(6,10,26,.35)"></div></div>'
            + `<div id="${c.id}-dim" style="position:absolute;inset:0;background:rgba(4,6,14,.75);opacity:0"></div>`;
        }
        const views = {
          drive: LR.V.road({ x: 360, k: 0.66, drive: true, lights: true, fg: L('<g fill="#ffcf8a" opacity=".55"><rect x="1500" y="520" width="26" height="22"/><rect x="1560" y="526" width="20" height="18"/><rect x="1700" y="516" width="26" height="24"/></g>') }),
          house: {
            html: (c) => house(c, {}),
            anim: (c) => c.act === 'out'
              ? LR.cam(c, { scale: 1.6, x: -620, y: 120 }, { scale: 1.62, x: -640, y: 120 })
              : (LR.fadeIn(c, 0.6), LR.cam(c, { scale: 1.02, x: 0 }, { scale: 1.05, x: 0 })),
          },
          table: { html: (c) => house(c, {}), anim: (c) => LR.cam(c, { scale: 1.8, x: 576, y: -170 }, { scale: 1.95, x: 624, y: -220 }) },
          // he knocks; nothing; he tries again
          door: {
            html: (c) => house(c, { knock: true }),
            anim: (c) => {
              c.tl.fromTo(`#${c.id}-ek`, { x: 0 }, { x: -8, duration: 0.1, yoyo: true, repeat: 3, ease: 'power2.inOut' }, c.t(0.4));
              c.tl.fromTo(`#${c.id}-ek`, { x: 0 }, { x: -8, duration: 0.1, yoyo: true, repeat: 3, ease: 'power2.inOut', immediateRender: false }, c.t(c.dur * 0.6));
              LR.cam(c, { scale: 1.5, x: -580, y: 60 }, { scale: 1.55, x: -600, y: 60 });
            },
          },
          wife: {
            html: (c) => house(c, { phone: c.act !== 'hug', wifeFace: c.act === 'phone' ? 'worried' : 'cry', sonAwake: c.act === 'hug' }),
            anim: (c) => LR.cam(c, { scale: 1.7, x: 950, y: -220 }, { scale: c.act === 'cry' ? 1.85 : 1.75, x: c.act === 'cry' ? 1030 : 980, y: -250 }),
          },
          // outside the door: what he wants to say
          ek: {
            html: (c) => house(c, { nocap: c.act === 'leave', ekFace: 'sad' }),
            anim: (c) => {
              if (c.act === 'leave') { c.tl.set(`#${c.id}-dim`, { opacity: 1 }, c.at); c.tl.fromTo(`#${c.id}-ek`, { x: 0, opacity: 1 }, { x: 500, opacity: 0.2, duration: c.dur, ease: 'sine.in' }, c.at); LR.cam(c, { scale: 1.3, x: -390, y: 40 }, { scale: 1.3, x: -390, y: 40 }); }
              else LR.cam(c, { scale: 1.9, x: -746, y: -130 }, { scale: 1.98, x: -780, y: -140 });
            },
          },
          son: {
            html: (c) => house(c, { sonAwake: true, phone: true, wifeFace: 'cry' }),
            anim: (c) => LR.cam(c, { scale: 1.75, x: 860, y: -230 }, { scale: 1.85, x: 900, y: -260 }),
          },
          // the whole cut-away: him outside, them inside; at the end the room is dimmed with him still there
          cut: {
            html: (c) => house(c, { phone: c.act !== 'dim', wifeFace: c.act === 'dim' ? 'sad' : 'cry', nocap: c.act === 'dim', sonAwake: c.act === 'dim' }),
            anim: (c) => {
              if (c.act === 'dim') c.tl.fromTo(`#${c.id}-dim`, { opacity: 0 }, { opacity: 1, duration: c.dur * 0.6, ease: 'sine.inOut' }, c.p(0.35));
              c.tl.fromTo(`#${c.id}-house`, { '--lr-house-light': 1 }, { '--lr-house-light': 0.15, duration: c.dur * 0.6, ease: 'sine.inOut' }, c.p(0.35));
              LR.cam(c, { scale: 1 }, { scale: 1.04 });
            },
          },
          _: { html: () => '' },
        };
        LR.run({ comp: 'scene-home', prefix: 'hm', tl, shots: S, views });
        window.__timelines["scene-home"] = tl;
      </script>
    </template>
  </body>
</html>

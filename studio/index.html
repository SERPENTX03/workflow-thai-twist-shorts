<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thai Twist Studio</title>
<style>
  @font-face { font-family: "Kanit"; src: url("../public/fonts/Kanit-Bold.ttf") format("truetype"); font-weight: 700; }
  @font-face { font-family: "Plex Thai"; src: url("../public/fonts/IBMPlexSansThai-Medium.ttf") format("truetype"); font-weight: 500; }
  @font-face { font-family: "Plex Thai"; src: url("../public/fonts/IBMPlexSansThai-Bold.ttf") format("truetype"); font-weight: 700; }
  :root {
    --bg: #0d1322;
    --panel: #161f33;
    --panel-2: #1f2a42;
    --line: #2b3854;
    --text: #f2eee6;
    --muted: #98a3b8;
    --gold: #f6c445;
    --red: #e5383b;
    --ok: #3fa66b;
    --radius: 14px;
    --sans: "Plex Thai", system-ui, sans-serif;
    --display: "Kanit", var(--sans);
    --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; scroll-padding-top: 72px; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 15px; line-height: 1.55; font-weight: 500; }
  img { display: block; max-width: 100%; }
  button { font: inherit; color: inherit; }
  code, .mono { font-family: var(--mono); font-size: 0.86em; }

  header.top { position: sticky; top: 0; z-index: 20; background: rgba(13, 19, 34, 0.9); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
  .top-inner { max-width: 1280px; margin: 0 auto; padding: 12px 24px; display: flex; align-items: center; gap: 24px; }
  .brand { font-family: var(--display); font-weight: 700; letter-spacing: 0.03em; white-space: nowrap; font-size: 18px; }
  .brand span { color: var(--gold); }
  nav { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
  nav a { color: var(--muted); text-decoration: none; padding: 6px 12px; border-radius: 999px; white-space: nowrap; font-size: 14px; }
  nav a:hover, nav a.on { color: var(--text); background: var(--panel-2); }

  main { max-width: 1280px; margin: 0 auto; padding: 8px 24px 80px; }
  section { padding-top: 40px; }
  .sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
  h2 { font-family: var(--display); font-size: 26px; margin: 0; }
  h2 small { font-family: var(--sans); font-size: 14px; color: var(--muted); font-weight: 500; margin-left: 10px; }
  h3 { font-size: 16px; color: var(--muted); margin: 22px 0 10px; font-weight: 700; }
  .hint { color: var(--muted); font-size: 13.5px; margin: 0; }
  .hint code { color: var(--text); background: var(--panel-2); padding: 1px 6px; border-radius: 6px; }

  .grid { display: grid; gap: 16px; }
  .cast-grid { grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  .card .pic { background: #0a0f1c; aspect-ratio: 600 / 640; cursor: zoom-in; }
  .card .pic img { width: 100%; height: 100%; object-fit: cover; }
  .card .body { padding: 14px 14px 16px; display: flex; flex-direction: column; gap: 10px; }
  .name { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .name b { font-size: 17px; }
  .name .en { color: var(--muted); font-size: 13px; }
  .desc { color: var(--muted); font-size: 13.5px; margin: 0; }
  .chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; padding: 3px 10px; border-radius: 999px; background: var(--panel-2); border: 1px solid var(--line); white-space: nowrap; }
  .chip .dot { width: 8px; height: 8px; border-radius: 50%; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .line { font-size: 14px; background: var(--panel-2); border-radius: 10px; padding: 10px 12px; margin: 0; }
  .line .tags { color: var(--gold); font-family: var(--mono); font-size: 12px; display: block; margin-bottom: 2px; }

  .play { display: inline-flex; align-items: center; gap: 8px; border: 0; cursor: pointer; background: var(--gold); color: #1d1608; font-weight: 700; font-size: 13.5px; padding: 7px 14px 7px 10px; border-radius: 999px; }
  .play:hover { filter: brightness(1.08); }
  .play svg { width: 16px; height: 16px; flex: none; }
  .play.on { background: var(--red); color: #fff; }
  .play[disabled] { background: var(--panel-2); color: var(--muted); cursor: not-allowed; }
  .play.small { padding: 5px 10px 5px 7px; font-size: 12.5px; background: var(--panel-2); color: var(--text); border: 1px solid var(--line); font-weight: 500; }
  .play.small.on { background: var(--red); color: #fff; border-color: var(--red); }

  .copy { border: 1px solid var(--line); background: transparent; color: var(--muted); border-radius: 8px; padding: 3px 8px; cursor: pointer; font-family: var(--mono); font-size: 12px; text-align: left; word-break: break-all; }
  .copy:hover { color: var(--text); border-color: var(--muted); }
  .copy.ok { color: var(--ok); border-color: var(--ok); }

  .voice-grid { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
  .voice .role { font-family: var(--mono); font-size: 13px; color: var(--gold); }
  .faces { display: flex; gap: 6px; flex-wrap: wrap; }
  .faces img { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; object-position: 50% 12%; border: 2px solid var(--line); background: #0a0f1c; }
  .meta { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 13px; color: var(--muted); align-items: center; }
  .meta b { color: var(--text); font-weight: 500; }
  .model-bar { display: flex; gap: 16px; flex-wrap: wrap; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 16px; margin-bottom: 16px; font-size: 13.5px; color: var(--muted); }
  .model-bar b { color: var(--text); font-family: var(--mono); font-weight: 500; }

  .tile-grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); }
  .tile .pic { aspect-ratio: 1; }
  .tile.tall .pic { aspect-ratio: 400 / 560; }
  .tile .body { padding: 8px 10px 10px; gap: 6px; font-family: var(--mono); font-size: 12.5px; }
  .tile .body .copy { font-size: 11px; }

  .wide-grid { grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); }
  .wide .pic { aspect-ratio: 1080 / 700; }
  .scene-grid { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
  .scene .pic { aspect-ratio: 9 / 16; }
  .scene .body { gap: 6px; }

  .sheet { border-radius: var(--radius); overflow: hidden; border: 1px solid var(--line); cursor: zoom-in; margin-top: 16px; }

  .ep { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; margin-bottom: 20px; }
  .ep h3 { margin: 0 0 4px; font-size: 20px; color: var(--text); font-family: var(--display); }
  .ep .topic { color: var(--muted); margin: 0 0 14px; }
  .tracks { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; align-items: center; }
  .strip { display: grid; grid-auto-flow: column; grid-auto-columns: 150px; gap: 12px; overflow-x: auto; padding-bottom: 8px; }
  .shot { background: var(--panel-2); border-radius: 10px; overflow: hidden; }
  .shot img { aspect-ratio: 9 / 16; object-fit: cover; cursor: zoom-in; width: 100%; }
  .shot div { padding: 8px 10px; font-size: 12px; }
  .shot .sid { font-family: var(--mono); color: var(--gold); }
  .shot .note { color: var(--muted); }
  video { width: 100%; max-width: 360px; border-radius: 10px; display: block; margin-bottom: 14px; background: #000; }

  .search { background: var(--panel); border: 1px solid var(--line); color: var(--text); border-radius: 999px; padding: 7px 14px; font: inherit; font-size: 14px; width: 240px; max-width: 100%; }
  .sfx-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }
  .sfx-grid .play { width: 100%; justify-content: flex-start; }
  .sfx-grid .play span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .lightbox { position: fixed; inset: 0; background: rgba(4, 6, 12, 0.92); display: none; align-items: center; justify-content: center; z-index: 50; padding: 24px; cursor: zoom-out; }
  .lightbox.on { display: flex; }
  .lightbox img { max-width: 100%; max-height: 100%; border-radius: 10px; }
  .missing { display: flex; align-items: center; justify-content: center; height: 100%; color: var(--muted); font-size: 13px; padding: 12px; text-align: center; }
  footer { color: var(--muted); font-size: 12.5px; text-align: center; padding: 24px; }

  @media (max-width: 640px) {
    .top-inner, main { padding-left: 16px; padding-right: 16px; }
    .top-inner { gap: 12px; }
    .wide-grid { grid-template-columns: 1fr; }
    .cast-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
    .scene-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
  }
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <div class="brand">THAI TWIST <span>STUDIO</span></div>
    <nav id="nav">
      <a href="#cast">ตัวละคร</a>
      <a href="#voices">เสียงพากย์</a>
      <a href="#faces">สีหน้า</a>
      <a href="#poses">ท่าทาง</a>
      <a href="#props">Props</a>
      <a href="#marks">เครื่องหมาย</a>
      <a href="#ui">UI ไทย</a>
      <a href="#scenes">ฉาก</a>
      <a href="#episodes">ตอน</a>
      <a href="#sfx">เสียงประกอบ</a>
    </nav>
  </div>
</header>

<main id="app"></main>
<div class="lightbox" id="lb"><img alt=""></div>
<footer id="foot"></footer>

<script src="manifest.js"></script>
<script>
(() => {
  const S = window.STUDIO;
  const app = document.getElementById('app');
  if (!S) { app.innerHTML = '<p class="hint" style="padding:40px 0">ยังไม่มี manifest.js: รัน <code>npm run gallery</code> ก่อน</p>'; return; }

  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  // renders keep their names between builds: tag each local media path with the build time to skip stale caches
  const V = `?v=${encodeURIComponent(S.built)}`;
  const bust = (o) => { for (const k in o) { const v = o[k]; if (typeof v === 'string' && /^(renders|audio|\.\.)\//.test(v) && /\.(png|mp3|wav|mp4)$/.test(v)) o[k] = v + V; else if (v && typeof v === 'object') bust(v); } };
  bust(S);
  const ROLE_COL = { male: '#5fa8e8', female: '#f28cb0', old_male: '#8fbf7a', old_female: '#e0a15a' };
  const ICON_PLAY = '<svg viewBox="0 0 16 16" fill="currentColor"><path d="M4 2.8v10.4c0 .6.7 1 1.2.6l8-5.2a.7.7 0 0 0 0-1.2l-8-5.2C4.7 1.8 4 2.2 4 2.8z"/></svg>';
  const ICON_STOP = '<svg viewBox="0 0 16 16" fill="currentColor"><rect x="3.5" y="3.5" width="9" height="9" rx="1.5"/></svg>';
  const playBtn = (src, label, cls = '') => src
    ? `<button class="play ${cls}" data-src="${esc(src)}">${ICON_PLAY}<span>${esc(label)}</span></button>`
    : `<button class="play ${cls}" disabled>${ICON_PLAY}<span>ยังไม่มีเสียง (npm run voices)</span></button>`;
  const pic = (src, alt) => src ? `<img src="${esc(src)}" alt="${esc(alt)}" loading="lazy" data-zoom>` : '<div class="missing">ยังไม่ได้เรนเดอร์<br>npm run gallery</div>';
  const tagsLine = (tone, line) => line ? `<p class="line">${tone ? `<span class="tags">${esc(tone.split(',').map((t) => `[${t.trim()}]`).join(' '))}</span>` : ''}${esc(line)}</p>` : '';
  const copyBtn = (text, label) => `<button class="copy" data-copy="${esc(text)}">${esc(label ?? text)}</button>`;
  const roleChip = (id) => id ? `<span class="chip"><span class="dot" style="background:${ROLE_COL[id] || '#999'}"></span>${esc(id)}</span>` : '<span class="chip">ไม่มีเสียง</span>';
  const tile = (x, cls = '') => `
    <article class="card tile ${cls}"><div class="pic">${pic(x.image, x.id)}</div>
      <div class="body"><span>${esc(x.id)}</span>${x.code ? copyBtn(x.code) : ''}</div></article>`;

  const castHTML = S.cast.map((c) => `
    <article class="card">
      <div class="pic">${pic(c.image, c.name)}</div>
      <div class="body">
        <div class="name"><b>${esc(c.nameTh)}</b><span class="en">${esc(c.name)}</span></div>
        <p class="desc">${esc(c.desc)}</p>
        <div class="row">${roleChip(c.role)}${c.cm ? `<span class="chip">${c.cm} ซม.</span>` : ''}${copyBtn(`<Sprite id="${c.id}" />`)}</div>
        ${tagsLine(c.tone, c.line)}
        ${c.role ? playBtn(c.audio, 'ฟังเสียง') : ''}
      </div>
    </article>`).join('');

  const voicesHTML = S.voices.roles.map((r) => `
    <article class="card voice">
      <div class="body">
        <div class="name"><b>${esc(r.whoTh)}</b><span class="role">${esc(r.id)}</span></div>
        <div class="meta"><span>Voice id</span><span>${copyBtn(r.id)}</span><span>ใช้กับ</span><b>${esc(r.use)}</b></div>
        ${tagsLine(r.tone, r.line)}
        ${playBtn(r.audio, 'ฟังเสียงตัวอย่าง')}
        <div>
          <p class="hint" style="margin-bottom:6px">ตัวละครที่ใช้เสียงนี้ (${r.cast.length})</p>
          <div class="faces">${r.cast.map((id) => { const c = S.cast.find((x) => x.id === id); return c && c.image ? `<img src="${esc(c.image)}" title="${esc(c.nameTh)}" alt="${esc(c.name)}">` : `<span class="chip">${esc(id)}</span>`; }).join('') || '<span class="hint">ยังไม่มี</span>'}</div>
        </div>
      </div>
    </article>`).join('');

  const uiHTML = S.ui.map((u) => `
    <article class="card wide">
      <div class="pic">${pic(u.image, u.id)}</div>
      <div class="body">
        <div class="name"><b>${esc(u.nameTh)}</b><span class="en">${esc(u.id)}</span></div>
        <p class="desc">${esc(u.use)}</p>
        <div>${copyBtn(u.code)}</div>
      </div>
    </article>`).join('');

  const scenesHTML = S.scenes.map((s) => `
    <article class="card scene">
      <div class="pic">${pic(s.image, s.scene)}</div>
      <div class="body">
        <div class="name"><b>${esc(s.nameTh)}</b><span class="en">${esc(s.scene)}${s.view ? ' · ' + esc(s.view) : ''}</span></div>
        <p class="desc">${esc(s.use)}</p>
        ${copyBtn(s.code, 'คัดลอก shot')}
      </div>
    </article>`).join('');

  const epsHTML = S.episodes.map((e) => `
    <article class="ep">
      <h3>${esc(e.title)}</h3>
      <p class="topic"><span class="mono">${esc(e.slug)}</span> · ${esc(e.format)} · ${e.seconds} วิ · ${e.shots.length} ช็อต · ${copyBtn(e.id)} ${copyBtn(e.id + 'Board')}</p>
      ${e.final ? `<video controls preload="none" src="${esc(e.final)}"></video>` : ''}
      <div class="tracks">${e.tracks.map((t) => playBtn(t.src, { voice: 'เสียงพากย์', score: 'ดนตรี + SFX' }[t.k] || t.k, 'small')).join('') || '<span class="hint">ยังไม่มีเสียง: npm run audio</span>'}</div>
      <div class="strip">${e.shots.map((s) => `
        <div class="shot">${s.image ? `<img src="${esc(s.image)}" alt="shot ${s.i}" loading="lazy" data-zoom>` : '<div class="missing" style="aspect-ratio:9/16">ยังไม่ได้เรนเดอร์</div>'}
          <div><span class="sid">#${s.i}</span> · ${esc(s.scene)}${s.view ? ' / ' + esc(s.view) : ''}<br><span class="note">${esc(s.text.replace(/[\[\]{}]/g, ''))}</span></div></div>`).join('')}</div>
    </article>`).join('') || '<p class="hint">ยังไม่มีตอน: <code>npm run new -- &lt;slug&gt; "ชื่อเรื่อง"</code></p>';

  const arms = S.poses.filter((p) => p.id.startsWith('arm-'));
  const bodies = S.poses.filter((p) => !p.id.startsWith('arm-'));

  app.innerHTML = `
    <section id="cast">
      <div class="sec-head"><h2>ตัวละคร<small>${S.cast.length} ตัว · ความสูงจริง</small></h2>
        <p class="hint">ภาพวาดใน <code>src/cast/source/cast.svg</code> · ชื่อ เสียง และบทตัวอย่างใน <code>src/cast.json</code></p></div>
      <div class="grid cast-grid">${castHTML}</div>
      ${S.castSheet ? `<img class="sheet" src="${esc(S.castSheet)}" alt="Cast sheet" data-zoom>` : ''}
    </section>

    <section id="voices">
      <div class="sec-head"><h2>เสียงพากย์<small>${S.voices.roles.length} บทบาท · ElevenLabs</small></h2>
        <p class="hint">ตั้งค่าใน <code>voices.json</code> แล้วรัน <code>npm run voices</code> (เสียเครดิตเฉพาะบรรทัดที่เปลี่ยน)</p></div>
      <div class="model-bar"><span>Model <b>${esc(S.voices.model)}</b></span><span>Default role <b>${esc(S.voices.default)}</b></span>${Object.entries(S.voices.settings || {}).map(([k, v]) => `<span>${esc(k)} <b>${esc(v)}</b></span>`).join('')}</div>
      <div class="grid voice-grid">${voicesHTML}</div>
    </section>

    <section id="faces">
      <div class="sec-head"><h2>สีหน้า &amp; ปาก<small>${S.faces.length} แบบ</small></h2><p class="hint"><code>&lt;Sprite id="man" hideFace layers={['face-shock']} /&gt;</code> · ปากพูด: <code>hideMouth</code> + <code>talk-*</code></p></div>
      <div class="grid tile-grid">${S.faces.map((x) => tile(x)).join('')}</div>
    </section>

    <section id="poses">
      <div class="sec-head"><h2>ท่าทาง<small>${bodies.length} ท่าเต็มตัว · ${arms.length} แขน</small></h2><p class="hint">แสดงบน <code>man</code> ตัวเดียว · แขน: ซ่อนแขนพัก แล้วซ้อนแขนท่า (กฎมือเดียว <code>hands-poses.md</code>) · แขนซ้าย = <code>arm-l-*</code></p></div>
      <h3>ท่าเต็มตัว</h3>
      <div class="grid tile-grid">${bodies.map((x) => tile(x, 'tall')).join('')}</div>
      <h3>แขน (ถือของ / ยื่น / ยก)</h3>
      <div class="grid tile-grid">${arms.map((x) => tile(x, 'tall')).join('')}</div>
    </section>

    <section id="props">
      <div class="sec-head"><h2>Props · ไอคอน · ชิ้นฉาก<small>${S.props.length} ชิ้น</small></h2><p class="hint">props จุดยึดอยู่ที่มือ (0,0) · กดโค้ดเพื่อคัดลอก</p></div>
      <div class="grid tile-grid">${S.props.map((x) => tile(x)).join('')}</div>
    </section>

    <section id="marks">
      <div class="sec-head"><h2>เครื่องหมาย &amp; อุปกรณ์<small>${S.marks.length} แบบ</small></h2><p class="hint">ซ้อนบนตัวละครด้วย <code>layers</code> · woman/auntie เลื่อนลง 4</p></div>
      <div class="grid tile-grid">${S.marks.map((x) => tile(x)).join('')}</div>
    </section>

    <section id="ui">
      <div class="sec-head"><h2>UI ภาษาไทย<small>${S.ui.length} แบบ · Kanit + IBM Plex Sans Thai</small></h2><p class="hint">อยู่ใน <code>src/kit/ui.tsx</code> · <code>[คำ]</code> = ทอง, <code>{คำ}</code> = แดง</p></div>
      <div class="grid wide-grid">${uiHTML}</div>
    </section>

    <section id="scenes">
      <div class="sec-head"><h2>ฉากสำเร็จรูป<small>${S.scenes.length} แบบ</small></h2><p class="hint">ใช้ชื่อใน <code>story.json</code> ได้เลย · อยู่ใน <code>src/scenes/</code> · กดคัดลอก shot</p></div>
      <div class="grid scene-grid">${scenesHTML}</div>
    </section>

    <section id="episodes">
      <div class="sec-head"><h2>ตอน<small>${S.episodes.length} ตอน</small></h2><p class="hint">Board จาก <code>&lt;Id&gt;Board</code> · <code>npm run studio</code> เพื่อเลื่อนดูทีละเฟรม</p></div>
      ${epsHTML}
    </section>

    <section id="sfx">
      <div class="sec-head"><h2>เสียงประกอบ<small>${S.sfx.length} ไฟล์</small></h2>
        <input class="search" id="sfxq" placeholder="ค้นหา เช่น knock, door"></div>
      <div class="sfx-grid" id="sfxgrid">${S.sfx.map((x) => playBtn(x.src, x.name, 'small').replace('<button', `<button title="${esc(x.prompt)}"`)).join('')}</div>
    </section>`;
  document.getElementById('foot').textContent = `สร้างเมื่อ ${new Date(S.built).toLocaleString('th-TH')} · npm run gallery เพื่ออัปเดต`;

  // one sound at a time
  const audio = new Audio();
  let cur = null;
  const stop = () => { audio.pause(); if (cur) { cur.classList.remove('on'); cur.querySelector('svg').outerHTML = ICON_PLAY; } cur = null; };
  audio.addEventListener('ended', stop);
  document.addEventListener('click', (ev) => {
    const b = ev.target.closest('.play[data-src]');
    if (b) {
      const same = cur === b;
      stop();
      if (same) return;
      audio.src = b.dataset.src;
      audio.play().catch(() => stop());
      cur = b; b.classList.add('on'); b.querySelector('svg').outerHTML = ICON_STOP;
      return;
    }
    const c = ev.target.closest('[data-copy]');
    if (c) {
      const done = () => { c.classList.add('ok'); setTimeout(() => c.classList.remove('ok'), 1200); };
      if (navigator.clipboard) navigator.clipboard.writeText(c.dataset.copy).then(done, () => {}); else done();
      return;
    }
    const z = ev.target.closest('[data-zoom]');
    const lb = document.getElementById('lb');
    if (z) { lb.querySelector('img').src = z.src; lb.classList.add('on'); return; }
    if (ev.target.closest('#lb')) lb.classList.remove('on');
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { document.getElementById('lb').classList.remove('on'); stop(); } });

  document.getElementById('sfxq').addEventListener('input', (e) => {
    const q = e.target.value.trim().toLowerCase();
    document.querySelectorAll('#sfxgrid .play').forEach((b) => { b.style.display = !q || (b.textContent + ' ' + b.title).toLowerCase().includes(q) ? '' : 'none'; });
  });

  // highlight the section in view
  const links = [...document.querySelectorAll('#nav a')];
  const io = new IntersectionObserver((es) => es.forEach((en) => {
    if (en.isIntersecting) links.forEach((a) => a.classList.toggle('on', a.getAttribute('href') === `#${en.target.id}`));
  }), { rootMargin: '-40% 0px -55% 0px' });
  document.querySelectorAll('main section').forEach((s) => io.observe(s));
})();
</script>
</body>
</html>
